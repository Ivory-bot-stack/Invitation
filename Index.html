<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0806">
<title>Una carta para Marlon y Ana Lacayo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --gold:184 154 99;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --paper:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.35'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b0806;overscroll-behavior:none}
body.lock{overflow:hidden;touch-action:none}
button{font:inherit}

/* Capas globales */
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;transition:opacity 1s}
.grain{position:fixed;inset:0;pointer-events:none;z-index:5;background:var(--paper);opacity:.5}
#snd{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(190,160,110,.4);background:rgba(10,8,6,.3);color:#d9c7a3;font-size:18px;cursor:pointer;opacity:.55;transition:opacity .3s}
#snd[aria-pressed=true]{opacity:1;box-shadow:0 0 0 4px rgba(190,160,110,.12)}

/* Escena 1: la carta */
#intro{position:fixed;inset:0;z-index:1;overflow:hidden;display:grid;place-items:center;background:radial-gradient(90% 60% at 50% 22%,#33241a 0%,#120d0a 60%,#060403 100%)}
#intro::before{content:"";position:absolute;inset:-10% 0 auto;height:75%;background:radial-gradient(60% 100% at 50% 0,rgba(220,170,110,.24),transparent 70%)}
.eb,.hint{position:absolute;left:0;right:0;text-align:center;font:italic 400 1.15rem var(--serif);color:#c4a97d;transition:opacity .6s}
.eb{top:calc(14% + env(safe-area-inset-top))}
.hint{bottom:calc(13% + env(safe-area-inset-bottom));font-size:1rem;animation:breath 3s ease-in-out infinite}
@keyframes breath{50%{opacity:.45}}
#cam{position:fixed;inset:0;display:grid;place-items:center;transform-origin:0 0;will-change:transform}
#cam.zoom{transition:transform 1.8s cubic-bezier(.7,0,.25,1)}
.fl{position:relative;width:min(84vw,380px);animation:float 7s ease-in-out infinite}
.fl.stop{animation-play-state:paused}
@keyframes float{50%{transform:translateY(-6px) rotate(.4deg)}}
.shadow{position:absolute;left:6%;right:6%;bottom:-16%;height:16%;background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent)}
.env{position:relative;aspect-ratio:3/2;transform:perspective(900px) rotateX(26deg) rotateZ(-3deg);transition:transform 1.5s cubic-bezier(.2,.7,.2,1)}
.env.open{transform:perspective(900px) rotateX(0) rotateZ(0)}
.env>*{position:absolute}
.back{inset:0;background:var(--paper),linear-gradient(#3b2a20,#241812);border-radius:3px}
.letter{left:4%;width:92%;bottom:3%;height:94%;z-index:2;background:var(--paper),linear-gradient(#f6eeda,#eadcc0);box-shadow:0 0 14px rgba(0,0,0,.3);transition:transform 1.2s cubic-bezier(.3,.7,.2,1)}
.letter.up{transform:translateY(-40%)}
.ink{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:9%;color:#3a2c20;font:italic 500 clamp(1.1rem,5vw,1.6rem) var(--serif);transition:opacity .9s .3s}
.ink span{width:40%;height:1px;background:rgba(80,55,30,.4);margin:.7em 0}
#cam.zoom .ink{opacity:0}
.front{inset:0;z-index:3;background:var(--paper),linear-gradient(180deg,#e9dcc0,#d8c5a2);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:0 0 3px 3px}
.front svg{position:absolute;inset:0;width:100%;height:100%}
.front p{position:absolute;left:0;right:0;bottom:11%;margin:0;text-align:center;font:italic 500 clamp(1rem,4.6vw,1.45rem) var(--serif);color:#4a3626}
.flap{left:0;top:0;width:100%;height:55%;z-index:4;transform-origin:50% 0;transform:perspective(700px) rotateX(0);transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.env.open .flap{transform:perspective(700px) rotateX(-180deg)}
.fo,.fi{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(0 0,100% 0,50% 100%)}
.fo{background:var(--paper),linear-gradient(180deg,#f4eAD4,#dfcfae)}
.fi{background:var(--paper),linear-gradient(#5a3b2e,#35241b);transform:rotateX(180deg)}
.seal{position:absolute;left:50%;bottom:-27px;margin-left:-27px;width:54px;height:54px;border:0;padding:0;border-radius:52% 48% 55% 45%/48% 55% 45% 52%;background:radial-gradient(circle at 35% 30%,#8e3a38,#5b1f24 55%,#331013);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 0 0 4px rgba(0,0,0,.14),inset 0 2px 3px rgba(255,210,190,.22);color:#d9a99b;font:italic 500 17px var(--serif);cursor:pointer;backface-visibility:hidden;-webkit-backface-visibility:hidden;animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 0 0 rgba(214,160,120,.45)}75%,100%{box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 0 24px rgba(214,160,120,0)}}
.seal.pop{animation:pop .7s forwards;pointer-events:none}
@keyframes pop{30%{transform:scale(.86)}60%{transform:scale(1.2)}100%{transform:scale(1.5) translateY(-8px);opacity:0}}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff4dc 20%,#f1e8d6 60%,transparent 100%)}
#flash.go{animation:fl 1s}
@keyframes fl{35%{opacity:.8}100%{opacity:0}}

/* Escena 2: la película */
#film{position:relative;z-index:3;display:none;opacity:0;transition:opacity .9s;--bg:241 232 214;--ink:42 33 26}
#film.in{opacity:1}
#pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:rgb(var(--bg));color:rgb(var(--ink))}
.lit{position:absolute;inset:0;opacity:0;background:radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.5))}
.lit i{position:absolute;left:-20%;right:-20%;top:-25%;height:85%;background:radial-gradient(closest-side,rgba(214,168,108,.3),transparent);animation:glow 7s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.12);opacity:.7}}
.cue{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));width:1px;height:46px;background:rgba(var(--gold)/.35);overflow:hidden}
.cue i{display:block;width:1px;height:16px;background:rgb(var(--gold));animation:cue 1.8s ease-in infinite}
@keyframes cue{from{transform:translateY(-16px)}to{transform:translateY(46px)}}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:env(safe-area-inset-top) 9vw env(safe-area-inset-bottom);opacity:0;visibility:hidden;pointer-events:none;font-family:var(--serif)}
.w{display:inline-block;opacity:0}
.ph{margin:0;max-width:min(100%,620px);font:italic 400 clamp(1.8rem,7.6vw,2.9rem)/1.28 var(--serif)}
.ph.big{font-size:clamp(2.3rem,10.5vw,4.2rem)}
.ph.sm{font-size:clamp(1.3rem,5.6vw,1.9rem);line-height:1.4}
.lb{margin:0 0 1.4rem;font:italic 400 1.15rem var(--serif);color:rgb(var(--gold));letter-spacing:.03em}
.pre{position:absolute;left:9vw;right:9vw;top:50%;margin:0 auto;translate:0 -50%}
.ttl{margin:0;font:italic 500 clamp(2.4rem,12vw,4.8rem)/1.04 var(--serif)}
.ln{display:block;padding:.06em 0}
.ln i{display:inline-block;clip-path:inset(-20% 100% -20% 0)}
.rule{display:block;width:min(38vw,150px);height:1px;background:rgb(var(--gold));margin:1.8rem auto 0;transform:scaleX(0)}
.num{font:400 clamp(8rem,42vw,16rem)/.85 var(--serif);text-shadow:0 1px 0 rgba(255,255,255,.14),0 -1px 0 rgba(0,0,0,.28);-webkit-mask-image:linear-gradient(180deg,#000 calc(var(--m,0)*1% - 16%),transparent calc(var(--m,0)*1%));mask-image:linear-gradient(180deg,#000 calc(var(--m,0)*1% - 16%),transparent calc(var(--m,0)*1%))}
.mo{margin:.9rem 0 0;font:italic 400 clamp(1.7rem,8vw,2.6rem) var(--serif);clip-path:inset(-20% 100% -20% 0)}
.ring{position:absolute;width:min(80vw,430px);aspect-ratio:1;left:50%;top:50%;translate:-50% -50%;rotate:-90deg}
.ring circle{fill:none;stroke:rgb(var(--gold));stroke-width:.35;stroke-dasharray:1;stroke-dashoffset:1}
.pl{position:relative;margin:0;font:italic 500 clamp(2.1rem,10vw,3.8rem)/1.1 var(--serif);clip-path:circle(0% at 50% 50%)}
.nm{margin:0 0 1.6rem;font:italic 500 clamp(2.7rem,13.5vw,5rem)/1.02 var(--serif);text-shadow:0 0 34px rgba(214,170,110,.35)}
.nm em{font-weight:400;color:rgb(var(--gold))}
.sg{margin:2.2rem 0 .3rem;font:italic 400 1.8rem var(--serif)}
.fr{margin:0;font:300 .95rem var(--sans);letter-spacing:.14em}
.seal.s2{position:relative;left:auto;bottom:auto;margin:1.8rem auto 0;animation:none;opacity:0}
.again{margin-top:1rem;min-height:44px;padding:.6rem .4rem;background:none;border:0;border-bottom:1px solid rgb(var(--gold));color:inherit;font:italic 400 1.05rem var(--serif);cursor:pointer;opacity:0;pointer-events:auto}
.off{animation:none;opacity:0}
@media (prefers-reduced-motion:reduce){.fl,.hint,.lit i,.cue i{animation:none}}
</style>
</head>
<body class="lock">
<canvas id="cv"></canvas>
<div class="grain"></div>
<button id="snd" aria-pressed="false" aria-label="Activar sonido">♪</button>

<section id="intro">
  <p class="eb" id="eb">Una carta para ustedes</p>
  <div id="cam">
    <div class="fl" id="fl">
      <div class="env" id="env">
        <div class="back"></div>
        <div class="letter" id="letter"><div class="ink">M · A<span></span></div></div>
        <div class="front">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0L50 55L100 0M0 100L50 55L100 100" fill="none" stroke="rgba(70,45,20,.3)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
          <p>Para Marlon y Ana Lacayo</p>
        </div>
        <div class="flap" id="flap"><div class="fo"></div><div class="fi"></div><button class="seal" id="seal" aria-label="Abrir carta">MA</button></div>
      </div>
      <div class="shadow"></div>
    </div>
  </div>
  <p class="hint" id="hint">Toca el sello para abrirla</p>
  <div id="flash"></div>
</section>

<main id="film"><div id="pin"><div class="lit" id="lit"><i></i></div><div class="cue" id="cue"><i></i></div></div></main>

<script>
/* ========== CONTENIDO: edita aquí los textos ========== */
const CONTENT={
  scenes:[
    {t:'thanks',dur:2,label:'Queridos padres espirituales',name:'Marlon y Ana Lacayo',text:'Con todo nuestro amor queremos invitarles a una celebración muy especial preparada para honrarles.'},
    {t:'words',dur:1.6,dim:1,text:'Ustedes son nuestros padres espirituales, los que nos cuidan, oran por nosotros y siempre están ahí para nosotros.'},
    {t:'title',dur:1.8,pre:'Con todo nuestro amor, una celebración muy especial…',lines:['preparada','para honrarles']},
    {t:'place',dur:1.5,label:'Lugar',lines:['Casa de habitación','de los mentores','Martín y Katherine']},
    {t:'date',dur:1.6,label:'Fecha',num:'5',month:'de diciembre',hour:'6:00 en punto'},
    {t:'close',dur:1.5,light:1,sign:'Con amor y honra,',from:'Sus hijos espirituales',again:'Volver a leer'}
  ]
};

/* ========== Utilidades y detección de dispositivo ========== */
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LOW=RM||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>x*x*(3-2*x),sg=(t,a,b)=>sm(cl((t-a)/(b-a)));
const wd=t=>t.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');
const W=(ws,t,a,b)=>{const n=ws.length;ws.forEach((w,k)=>{const o=sg(t,a+(b-a)*k/n,a+(b-a)*k/n+.1);w.style.opacity=o;w.style.transform=RM?'':`translateY(${(1-o)*12}px)`})};
const clip=(t,a,b)=>`inset(-20% ${(1-sg(t,a,b))*100}% -20% -5%)`;

/* ========== Sonido (Web Audio sintetizado, apagado por defecto) ========== */
let AC,sndOn=false,amb;
const ac=()=>{AC||=new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();return AC};
function nz(dur,f,q,v,f2){const c=ac(),n=c.sampleRate*dur,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start()}
function sfx(n){if(!sndOn)return;try{const c=ac();
  if(n==='seal'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(110,c.currentTime);o.frequency.exponentialRampToValueAtTime(45,c.currentTime+.3);g.gain.setValueAtTime(.35,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.45);nz(.12,3200,1,.3)}
  if(n==='paper')nz(.8,2400,.7,.35);
  if(n==='paper2')nz(1.1,1600,.6,.3);
  if(n==='whoosh')nz(1.7,300,.5,.3,2200)}catch(e){}}
function ambient(on){try{const c=ac();
  if(on&&!amb){const g=c.createGain(),f=c.createBiquadFilter();g.gain.value=0;f.type='lowpass';f.frequency.value=500;
    [110,164.8,220.4].forEach((fr,i)=>{const o=c.createOscillator(),og=c.createGain();o.frequency.value=fr;og.gain.value=.5/(i+1);o.connect(og);og.connect(f);o.start()});
    f.connect(g);g.connect(c.destination);amb=g}
  if(amb)amb.gain.setTargetAtTime(on?.05:0,c.currentTime,on?1.2:.4)}catch(e){}}
$('#snd').onclick=e=>{sndOn=!sndOn;e.currentTarget.setAttribute('aria-pressed',sndOn);ambient(sndOn);if(sndOn)nz(.5,2400,.7,.2)};
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():sndOn&&AC.resume()});

/* ========== Partículas de polvo luminoso (sprite + canvas 2D) ========== */
const cv=$('#cv'),cx=cv.getContext('2d'),N=RM?0:LOW?14:34,dpr=LOW?1:Math.min(devicePixelRatio||1,1.5);
const spr=document.createElement('canvas');spr.width=spr.height=32;
{const g=spr.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'rgba(255,232,190,1)');r.addColorStop(1,'rgba(255,232,190,0)');g.fillStyle=r;g.fillRect(0,0,32,32)}
let CW,CH,P=[],last=0;
function size(){CW=innerWidth;CH=innerHeight;cv.width=CW*dpr;cv.height=CH*dpr}
size();for(let i=0;i<N;i++)P.push({x:Math.random()*CW,y:Math.random()*CH,z:.3+Math.random()*.7,vx:(Math.random()-.5)*.12,vy:.05+Math.random()*.12,ph:Math.random()*6});
function loop(ts){requestAnimationFrame(loop);
  if(document.hidden||!N||+cv.style.opacity<.02&&cv.style.opacity!=='')return;
  if(LOW&&ts-last<33)return;last=ts;cx.clearRect(0,0,cv.width,cv.height);const sy=scrollY*.12;
  for(const p of P){p.x+=p.vx*p.z;p.y-=p.vy*p.z;if(p.y<-20)p.y=CH+20;if(p.x<-20)p.x=CW+20;if(p.x>CW+20)p.x=-20;
    const s=(5+p.z*12)*dpr,y=((p.y-sy*p.z)%CH+CH)%CH;cx.globalAlpha=(.15+.5*p.z)*(.65+.35*Math.sin(ts/1400+p.ph));
    cx.drawImage(spr,p.x*dpr-s/2,y*dpr-s/2,s,s)}}
requestAnimationFrame(loop);

/* ========== Escenas: cada tipo = HTML + función de animación según el scroll ========== */
const R={
  words:{h:s=>`<p class="ph${s.big?' big':''}">${wd(s.text)}</p>`,u:(s,t)=>W(s.ws,t,.06,.62)},
  title:{h:s=>`<p class="ph sm pre">${wd(s.pre)}</p><h2 class="ttl">${s.lines.map(l=>`<span class="ln"><i>${l}</i></span>`).join('')}</h2><span class="rule"></span>`,
    u:(s,t)=>{W(s.ws,t,.04,.34);s.$('.pre').style.opacity=1-sg(t,.36,.5);
      s.el.querySelectorAll('.ln i').forEach((e,k)=>{const w=sg(t,.38+k*.12,.62+k*.12);e.style.clipPath=clip(t,.38+k*.12,.62+k*.12);e.style.transform=RM?'':`translateY(${(1-w)*16}px)`});
      s.$('.rule').style.transform=`scaleX(${sg(t,.74,.92)})`}},
  date:{h:s=>`<p class="lb">${s.label}</p><div class="num">${s.num}</div><p class="mo">${s.month}</p><p class="mo">${s.hour}</p>`,
    u:(s,t)=>{s.$('.lb').style.opacity=sg(t,.04,.22);s.$('.num').style.setProperty('--m',sg(t,.18,.6)*120);s.$('.mo').style.clipPath=clip(t,.5,.72);s.$('.mo+.mo').style.clipPath=clip(t,.68,.9)}},
  place:{h:s=>`<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" pathLength="1"/></svg><p class="lb">${s.label}</p><h2 class="pl">${s.lines.join('<br>')}</h2>`,
    u:(s,t)=>{s.$('.lb').style.opacity=sg(t,.04,.2);s.$('.ring circle').style.strokeDashoffset=1-sg(t,.08,.6);s.$('.pl').style.clipPath=`circle(${sg(t,.28,.7)*80}% at 50% 50%)`}},
  thanks:{h:s=>`<p class="lb">${s.label}</p><h2 class="nm">${s.name.replace(' y ',' <em>y</em> ')}</h2><p class="ph sm">${wd(s.text)}</p>`,
    u:(s,t)=>{s.$('.lb').style.opacity=sg(t,.04,.2);const w=sg(t,.08,.3),n=s.$('.nm');n.style.opacity=w;n.style.transform=RM?'':`scale(${1.06-.06*w})`;W(s.ws,t,.34,.78)}},
  close:{h:s=>`<p class="sg">${s.sign}</p><p class="fr">${s.from}</p><div class="seal s2">MA</div><button class="again">${s.again}</button>`,
    u:(s,t)=>{s.$('.sg').style.opacity=sg(t,.15,.35);s.$('.sg').style.transform=`translateY(${(1-sg(t,.15,.35))*14}px)`;s.$('.fr').style.opacity=sg(t,.35,.55);
      const w=sg(t,.58,.78),e=s.$('.s2');e.style.opacity=w;e.style.transform=`scale(${1.7-.7*w})`;s.$('.again').style.opacity=sg(t,.85,1)}}
};
const S=CONTENT.scenes,pin=$('#pin'),F=$('#film'),lit=$('#lit');
S.forEach(s=>{const el=document.createElement('section');el.className='sc';el.innerHTML=R[s.t].h(s);pin.appendChild(el);
  s.el=el;s._={};s.$=k=>s._[k]||=el.querySelector(k);s.ws=[...el.querySelectorAll('.w')];s.on=0});
S[S.length-1].last=1;

/* ========== Motor de scroll (una sola rAF, sólo escenas activas) ========== */
const A=[241,232,214],B=[14,11,9],IA=[42,33,26],IB=[236,226,206];
const mix=(a,b,d)=>a.map((v,i)=>Math.round(v+(b[i]-v)*d)).join(' ');
let U,tick=0,started=0,lastD=-1,lw=innerWidth;
function layout(){U=innerHeight*.9;let c=0;S.forEach(s=>{s.st=c;c+=s.dur});F.style.height=(c*U+innerHeight)+'px'}
function frame(){tick=0;if(!started)return;const p=scrollY/U;let d=0;
  for(const s of S){if(s.dim&&p>s.st+.72*s.dur)d=cl((p-s.st-.72*s.dur)/(.26*s.dur));if(s.light&&p>s.st)d=1-cl((p-s.st)/(.5*s.dur))}
  if(Math.abs(d-lastD)>.003){lastD=d;F.style.setProperty('--bg',mix(A,B,d));F.style.setProperty('--ink',mix(IA,IB,d));lit.style.opacity=d;cv.style.opacity=.9*d;$('#snd').style.color=`rgb(${mix(IA,IB,d).replace(/ /g,',')})`}
  $('#cue').style.opacity=1-sg(p,.1,.4);
  for(const s of S){const t=(p-s.st)/s.dur;
    if(t<-.02||t>1.02){if(s.on){s.el.style.visibility='hidden';s.on=0}continue}
    if(!s.on){s.el.style.visibility='visible';s.on=1}
    const a=sg(t,0,.16)*(s.last?1:1-sg(t,.86,1));
    s.el.style.opacity=a;s.el.style.transform=RM?'':`translate3d(0,${(.5-t)*30}px,0) scale(${1+(t-.5)*.05})`;
    s.el.style.filter=(!LOW&&a<.99)?`blur(${(1-a)*7}px)`:'none';R[s.t].u(s,t)}}
addEventListener('scroll',()=>{if(!tick){tick=1;requestAnimationFrame(frame)}},{passive:true});
addEventListener('resize',()=>{if(innerWidth!==lw){lw=innerWidth;layout();size()}});
document.addEventListener('click',e=>{if(e.target.closest('.again'))scrollTo({top:0,behavior:RM?'auto':'smooth'})});

/* ========== Apertura: sello → sobre → carta → cámara entra en el papel ========== */
const E=$('#env'),L=$('#letter'),cam=$('#cam');let opened=0;
function open(){if(opened)return;opened=1;sfx('seal');$('#seal').classList.add('pop');$('#fl').classList.add('stop');$('#hint').classList.add('off');$('#eb').classList.add('off');
  if(RM)return setTimeout(enter,500);
  setTimeout(()=>{sfx('paper');E.classList.add('open');setTimeout(()=>$('#flap').style.zIndex=1,420)},450);
  setTimeout(()=>{sfx('paper2');L.classList.add('up')},1500);
  setTimeout(zoom,2750)}
function zoom(){$('#flash').classList.add('go');L.style.zIndex=6;
  const r=L.getBoundingClientRect(),s=Math.max(innerWidth/r.width,innerHeight/r.height)*1.08;
  cam.classList.add('zoom');cam.style.transform=`translate(${innerWidth/2-(r.left+r.width/2)*s}px,${innerHeight/2-(r.top+r.height/2)*s}px) scale(${s})`;
  sfx('whoosh');setTimeout(enter,1700)}
function enter(){F.style.display='block';document.body.classList.remove('lock');layout();scrollTo(0,0);started=1;frame();
  requestAnimationFrame(()=>F.classList.add('in'));setTimeout(()=>$('#intro').style.display='none',1000)}
$('#seal').onclick=open;$('#env').onclick=open;
</script>
